
name: Build Aviator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_FILE=$(find extracted -type f -name "settings.gradle.kts" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Align Java and Kotlin targets
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          project = Path(os.environ["PROJECT_DIR"])
          for file in project.rglob("*.gradle.kts"):
              text = file.read_text()
              text = text.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              text = text.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
              text = text.replace('"1.8".toInt()', '"17".toInt()')
              file.write_text(text)

          for file in project.rglob("*.gradle"):
              text = file.read_text()
              text = text.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              text = text.replace("VERSION_1_8", "VERSION_17")
              file.write_text(text)

          print("Java/Kotlin target adjustment completed")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            cd "$RUNNER_TEMP"
            curl -fsSLo gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q gradle.zip
            cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
            "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon assembleDebug
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Analysis-Pro-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
