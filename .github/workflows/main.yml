name: Build Aviator APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: |
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      yes | sdkmanager --licenses

  - name: Extract Android project ZIP
    shell: bash
    run: |
      set -e
      mkdir -p extracted
      ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Project ZIP not found"
        exit 1
      fi
      unzip -q "$ZIP_FILE" -d extracted
      PROJECT_FILE=$(find extracted -type f -name "settings.gradle.kts" | head -n 1)
      if [ -z "$PROJECT_FILE" ]; then
        echo "ERROR: settings.gradle.kts not found in ZIP"
        exit 1
      fi
      PROJECT_DIR=$(dirname "$PROJECT_FILE")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Android project found: $PROJECT_DIR"

  - name: Align Java and Kotlin JVM targets
    shell: bash
    run: |
      set -e
      python3 - <<'PY'
      import os
      from pathlib import Path

      project = Path(os.environ["PROJECT_DIR"])
      file = project / "app" / "build.gradle.kts"

      if not file.exists():
          raise SystemExit(f"ERROR: Gradle file not found: {file}")

      text = file.read_text()

      text = text.replace(
          "JavaVersion.VERSION_1_8",
          "JavaVersion.VERSION_17"
      )
      text = text.replace(
          'jvmTarget = "1.8"',
          'jvmTarget = "17"'
      )
      text = text.replace(
          'jvmTarget = "1.8"',
          'jvmTarget = "17"'
      )

      file.write_text(text)
      print("Updated Java/Kotlin target settings where matching text was found.")
      PY

  - name: Build debug APK
    shell: bash
    run: |
      set -e
      cd "$PROJECT_DIR"

      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        ./gradlew assembleDebug
      else
        cd "$RUNNER_TEMP"
        curl -fsSLo gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
        unzip -q gradle.zip
        cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
        "$RUNNER_TEMP/gradle-8.9/bin/gradle" assembleDebug
      fi

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Aviator-Analysis-Pro-APK
      path: "**/app/build/outputs/apk/debug/*.apk"
      if-no-files-found: error
