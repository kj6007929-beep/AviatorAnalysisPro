
      - name: Align Java and Kotlin targets
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          project = Path(os.environ["PROJECT_DIR"])
          gradle_files = list(project.rglob("*.gradle.kts"))
          gradle_files += list(project.rglob("*.gradle"))

          for file in gradle_files:
              text = file.read_text()
              original = text

              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )
              text = re.sub(
                  r'(?m)^(\s*sourceCompatibility\s*=\s*)["\']1\.8["\']',
                  r'\1JavaVersion.VERSION_17',
                  text
              )
              text = re.sub(
                  r'(?m)^(\s*targetCompatibility\s*=\s*)["\']1\.8["\']',
                  r'\1JavaVersion.VERSION_17',
                  text
              )
              text = text.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )
              text = text.replace(
                  "jvmTarget = '1.8'",
                  'jvmTarget = "17"'
              )

              if text != original:
                  file.write_text(text)
                  print(f"Updated: {file}")

          print("Java and Kotlin target adjustments completed")
          PY
